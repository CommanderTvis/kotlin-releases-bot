name = "kotlin-releases-bot"
main = "build/index.js"
compatibility_date = "2026-09-05"

[build]
command = "cargo install -q worker-build && worker-build --release"

[triggers]
crons = ["*/15 * * * *"]

[vars]
# chat_id, or chat_id:message_thread_id for a forum topic. Comma-separated.
TARGETS = ""

[[kv_namespaces]]
binding = "SEEN"
id = "replace-with-your-namespace-id"
